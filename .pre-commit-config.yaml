# Run by prek on every commit. Local hooks use the uv-managed environment.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: pyrefly
        name: pyrefly check
        entry: uv run --frozen pyrefly check
        language: system
        types: [python]
        pass_filenames: false
      - id: plugin-changes
        name: plugin fork changes (ruff on what we changed against upstream/main)
        entry: uv run --frozen python scripts/check_plugin.py
        language: system
        pass_filenames: false
        always_run: true
