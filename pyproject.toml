[project]
name = "hermes-xmpp-calls"
version = "0.0.0"
description = "Live XMPP audio calls for Hermes Agent (Jingle RTP + aiortc), developed for the hermes-xmpp-plugin fork."
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "slixmpp>=1.17,<2",
    "aiortc>=1.16,<2",
    "av>=19.0.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "webrtcvad-wheels>=2.0.14.post1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "pyrefly>=1.4.1",
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xmpp_calls"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".claude", ".hermes"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF", "PT",
    "C4", "PERF", "PIE", "FURB", "A", "PLE", "PLW", "RET", "TC006", "N", "T20", "S110", "S112",
]
# N818: IllegalTransition and friends are public names of the library, an Error suffix buys nothing.
# Deliberately not enabled: LOG015 (the engine logs through the root logger, 45 calls: change it
# on its own), PTH, ARG, PLR2004, TRY003 and D (noise, no bugs found).
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]  # command-line tools print
"tests/*" = ["T201"]
"RESEARCH/*" = ["T201", "S110"]  # one-off evidence scripts

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["."]
python-version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
