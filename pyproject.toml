[project]
name = "hermes-xmpp-calls"
version = "0.0.0"
description = "Live XMPP audio calls for Hermes Agent (Jingle RTP + aiortc), developed for the hermes-xmpp-plugin fork."
requires-python = ">=3.13"
dependencies = [
    "slixmpp>=1.15,<2",
    "aiortc>=1.16,<2",
    "av>=19",
    "numpy>=2",
    "pyyaml>=6.0.3",
    "webrtcvad-wheels>=2.0.14.post1",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pyrefly>=0.60",
    "prek>=0.3",
    "pytest>=9",
    "pytest-asyncio>=1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xmpp_calls"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".claude", ".hermes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF", "PT"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["."]
python-version = "3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
